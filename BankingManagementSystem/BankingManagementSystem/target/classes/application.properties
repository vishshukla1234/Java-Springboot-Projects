spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# create-drop is convenient while entities are still changing during development -
# every restart gives you a schema that matches your current code exactly,
# which avoids the "Data truncated" / stale foreign key issues from earlier.
# Switch to "update" (with Flyway/Liquibase migrations for real changes) once
# your entities stabilize and you need data to survive a restart.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

